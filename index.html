<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نموذج الاتصال — تجريبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#7a1a1a; --brand-hover:#5f1414;
    --bg:#f6f4f2; --card:#ffffff; --text:#222; --muted:#666;
    --border:#ddd; --ok:#1a7f37; --ok-bg:#e8f5ec; --err:#b3261e; --err-bg:#fdecea;
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#171515; --card:#232020; --text:#eee; --muted:#aaa;
      --border:#3d3838; --brand:#c05050; --brand-hover:#d06060;
      --ok:#4cc26a; --ok-bg:#15301c; --err:#ff8a80; --err-bg:#3a1512;
    }
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    padding:18px 24px; border-top:4px solid var(--brand);
    border-bottom:1px solid var(--border); background:var(--card);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  header h1{font-size:18px; margin:0; font-weight:700}
  header .badge{
    font-size:12px; color:var(--muted); border:1px solid var(--border);
    padding:4px 12px; border-radius:999px; white-space:nowrap;
  }
  main{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:32px 16px calc(32px + env(safe-area-inset-bottom,0px));
  }
  .card{
    width:100%; max-width:520px; background:var(--card);
    border:1px solid var(--border); border-radius:var(--radius);
    padding:28px 24px; box-shadow:0 8px 30px rgba(0,0,0,.07);
  }
  .card h2{margin:0 0 6px; font-size:22px}
  .card p.sub{margin:0 0 22px; color:var(--muted); font-size:14px; line-height:1.7}
  label{display:block; font-size:14px; font-weight:600; margin:0 0 6px}
  .field, textarea{
    width:100%; border:1.5px solid var(--border); border-radius:10px;
    background:var(--bg); color:var(--text);
    font:inherit; font-size:15px;
    padding:12px 14px; min-height:48px;
    margin-bottom:16px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  textarea{min-height:130px; resize:vertical; line-height:1.8}
  .field:focus, textarea:focus{
    border-color:var(--brand);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent);
  }
  button{
    width:100%; min-height:48px; border:0; border-radius:10px;
    background:var(--brand); color:#fff; font:inherit; font-size:16px; font-weight:700;
    cursor:pointer; transition:background .15s, opacity .15s;
  }
  button:hover{background:var(--brand-hover)}
  button:disabled{opacity:.55; cursor:not-allowed}
  .status{
    display:none; margin-top:16px; padding:12px 14px; border-radius:10px;
    font-size:14px; line-height:1.7;
  }
  .status.ok{display:block; background:var(--ok-bg); color:var(--ok); border:1px solid color-mix(in srgb, var(--ok) 35%, transparent)}
  .status.err{display:block; background:var(--err-bg); color:var(--err); border:1px solid color-mix(in srgb, var(--err) 35%, transparent)}
  footer{
    text-align:center; padding:14px; font-size:12px; color:var(--muted);
    border-top:1px solid var(--border);
    padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  }
  @media (max-width:430px){
    header{padding:14px 16px}
    .card{padding:22px 18px; border-radius:12px}
  }
</style>
</head>
<body>

<header>
  <h1>نموذج الاتصال</h1>
  <span class="badge">Prototype — Formspree</span>
</header>

<main>
  <form class="card" id="contactForm" novalidate>
    <h2>تواصل معنا</h2>
    <p class="sub">نموذج تجريبي: تُرسَل البيانات إلى خادم Express المحلي الذي يعيد توجيهها إلى Formspree بصيغة JSON.</p>

    <label for="name">الاسم <span aria-hidden="true">*</span></label>
    <input class="field" id="name" name="name" type="text"
           autocomplete="name" placeholder="اكتب اسمك" required>

    <label for="message">الرسالة <span aria-hidden="true">*</span></label>
    <textarea id="message" name="message"
              placeholder="اكتب رسالتك هنا…" required></textarea>

    <button type="submit" id="submitBtn">إرسال</button>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>
</main>

<footer>يعمل محليًا عبر <code>node server.js</code> على المنفذ 3000</footer>

<script>
// رابط Formspree — يُستخدم كمسار احتياطي فقط عند فتح الصفحة دون خادم Express
const FORMSPREE_URL = "https://formspree.io/f/xzeddwyr";

const form      = document.getElementById("contactForm");
const btn       = document.getElementById("submitBtn");
const statusBox = document.getElementById("status");

function showStatus(type, text) {
  statusBox.className = "status " + type;
  statusBox.textContent = text;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name    = form.name.value.trim();
  const message = form.message.value.trim();

  if (!name || !message) {
    showStatus("err", "من فضلك املأ حقلَي الاسم والرسالة قبل الإرسال.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "جارٍ الإرسال…";
  statusBox.className = "status";

  const payload = { name, message };

  try {
    // (1) المسار الأساسي: خادم Express المحلي الذي يعيد التوجيه إلى Formspree
    let sentVia = null;
    try {
      const r = await fetch("/api/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) throw new Error(data.error || "رفض الخادم الطلب");
      sentVia = "server";
    } catch (serverErr) {
      // (2) مسار احتياطي: الإرسال المباشر إلى Formspree
      //     (يُفيد عند معاينة الصفحة وحدها بدون تشغيل الخادم)
      const r = await fetch(FORMSPREE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!r.ok) throw serverErr;
      sentVia = "formspree-direct";
    }

    showStatus("ok", sentVia === "server"
      ? "✅ تم الإرسال بنجاح عبر الخادم المحلي — تحقق من لوحة تحكم Formspree وبريدك الإلكتروني."
      : "✅ تم الإرسال بنجاح مباشرةً إلى Formspree (الخادم المحلي غير متاح).");
    form.reset();
  } catch (err) {
    showStatus("err", "❌ فشل الإرسال: " + (err.message || "خطأ غير متوقع") +
      " — تأكد من تشغيل الخادم (node server.js) ومن صحة رابط Formspree.");
  } finally {
    btn.disabled = false;
    btn.textContent = "إرسال";
  }
});
</script>

</body>
</html>
